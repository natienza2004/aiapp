<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvenTrack — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">📦</div>
        <div>
          <div class="logo-text">Inven<span>Track</span></div>
          <div style="font-size:0.65rem;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;">Inventory System</div>
        </div>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-sub">Sign in to your account to continue</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="button primary" style="width:100%;padding:0.75rem;font-size:0.9rem;margin-top:0.5rem;">Sign in</button>
        <div id="form-status" class="status"></div>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
