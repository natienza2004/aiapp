<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvenTrack — Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="register">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">📦</div>
        <div>
          <div class="logo-text">Inven<span>Track</span></div>
          <div style="font-size:0.65rem;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;">Inventory System</div>
        </div>
      </div>

      <h1 class="auth-heading">Create account</h1>
      <p class="auth-sub">Fill in your details to get started</p>

      <form id="register-form">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" placeholder="John Doe" required />
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <div class="field">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="STUDENT">Student</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit" class="button primary" style="width:100%;padding:0.75rem;font-size:0.9rem;margin-top:0.5rem;">Create account</button>
        <div id="form-status" class="status"></div>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
